<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1229 Electricals | Solar, Electrical, Ceilings, Gweru</title>
<meta name="description" content="1229 Electricals, Gweru, Zimbabwe. Solar systems, house wiring, boreholes, ceilings, gates, fences, CCTV and appliance repairs.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/frames240/f001.webp" as="image" media="(max-width:1099px)">
<link rel="preload" href="/frames240hd/f001.webp" as="image" media="(min-width:1100px)">
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="loading">

<div id="loader" aria-live="polite">
  <div class="loader-num">1229</div>
  <div class="loader-bar"><i id="loaderFill"></i></div>
  <div class="loader-txt"><span id="loaderPct">0</span>%</div>
</div>

<header class="nav" id="nav">
  <a class="logo" href="#top" aria-label="1229 Electricals home"><b>1229</b><span>Electricals</span></a>
  <nav class="nav-links" aria-label="Main">
    <a href="#packages">Services</a><a href="#about">About</a><a href="#quote">Get a quote</a>
  </nav>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark and light mode">
    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main id="top">
  <!-- SCROLL HERO -->
  <section class="hero" id="hero">
    <div class="hero-pin">
      <div class="stage">
        <canvas id="cv" aria-label="Scroll to explore our services" role="img"></canvas>
        <div class="stage-shade"></div>
      </div>
      <div class="chapters" id="chapters" aria-live="polite"></div>
      <div class="hero-ui">
        <div class="prog"><i id="prog"></i></div>
        <div class="cue" id="cue"><span></span>Scroll</div>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about" id="about">
    <div class="wrap">
      <p class="eyebrow reveal">About us</p>
      <h2 class="big reveal" id="aboutTitle"></h2>
      <p class="lead reveal" id="aboutText"></p>
      <div class="mv">
        <article class="card reveal"><h3>Mission</h3><p id="mission"></p></article>
        <article class="card reveal"><h3>Vision</h3><p id="vision"></p></article>
        <article class="card promise reveal"><h3>Brand promise</h3><p id="promise"></p></article>
      </div>
    </div>
  </section>

  <!-- PACKAGES -->
  <section class="packages" id="packages">
    <div class="wrap">
      <p class="eyebrow reveal">What we do</p>
      <h2 class="big reveal">Everything your property needs, <em>one team.</em></h2>
    </div>
    <div class="pkg-grid wrap" id="pkgGrid"></div>
  </section>

  <!-- PULSE & PERFECTION -->
  <section class="pp" id="pp">
    <div class="pp-side pulse">
      <img id="imgPulse" alt="" loading="lazy" decoding="async">
      <div class="pp-copy"><p class="eyebrow">01</p><h3 id="pulseTitle"></h3><p id="pulseText"></p></div>
    </div>
    <div class="pp-side perf">
      <img id="imgPerf" alt="" loading="lazy" decoding="async">
      <div class="pp-copy"><p class="eyebrow">02</p><h3 id="perfTitle"></h3><p id="perfText"></p></div>
    </div>
  </section>

  <!-- VALUES -->
  <section class="values">
    <div class="wrap">
      <p class="eyebrow reveal">How we work</p>
      <div class="val-grid" id="valGrid"></div>
    </div>
  </section>

  <!-- QUOTE -->
  <section class="quote" id="quote">
    <div class="wrap quote-grid">
      <div>
        <p class="eyebrow reveal">Get in touch</p>
        <h2 class="big reveal" id="payTitle"></h2>
        <p class="lead reveal" id="payText"></p>
        <ul class="contact reveal" id="contactList"></ul>
      </div>
      <form class="form reveal" id="leadForm" novalidate>
        <label>Your name<input name="name" required autocomplete="name"></label>
        <label>Phone / WhatsApp<input name="phone" required inputmode="tel" autocomplete="tel"></label>
        <label>Service<select name="service" id="svcSel"></select></label>
        <label>Tell us about the job<textarea name="message" rows="4"></textarea></label>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Send request</button>
        <p class="form-msg" id="formMsg" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div><b class="logo-t">1229</b> <span id="footLegal"></span></div>
    <div id="footAddr"></div>
  </div>
</footer>

<a class="wa" id="waBtn" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14c-.2.6-1.300 1.200-1.800 1.200-.5.100-1.100.100-1.800-.1a12 12 0 0 1-4.700-2.900 9 9 0 0 1-2-3c-.3-1 .1-1.800.6-2.300.2-.2.4-.2.600-.2h.4c.2 0 .4 0 .5.400l.8 1.900c.1.200 0 .4-.1.500l-.4.500c-.1.200-.3.300-.1.600.7 1.100 1.600 1.900 2.700 2.500.3.200.5.100.7-.1l.6-.8c.2-.2.400-.2.600-.1l1.800.9c.2.100.4.200.4.300.1.200.1.700-.1 1.200z"/></svg>
</a>

<dialog id="modal" aria-label="Service details">
  <button class="m-close" id="mClose" aria-label="Close">×</button>
  <div class="m-gal" id="mGal"></div>
  <div class="m-dots" id="mDots"></div>
  <div class="m-body">
    <p class="eyebrow" id="mTag"></p>
    <h3 id="mTitle"></h3>
    <p id="mBlurb"></p>
    <ul id="mFeat"></ul>
    <a class="btn" id="mCta" href="#quote">Request this service</a>
  </div>
</dialog>

<script src="/vendor/lenis.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
